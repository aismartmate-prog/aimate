<title>Tirgulim ad live</title>
<style>
/*FONTS*/
.fa{font-family:'FA6';font-weight:900;font-style:normal;line-height:1;display:inline-block}
#shape{display:none}
.E{position:absolute;left:0;top:0}
#bg{position:absolute;left:-540px;top:-960px;width:1080px;height:1920px;background:#0a1633;overflow:hidden}
.glow{position:absolute;border-radius:50%}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(148,184,255,.15) 2px,transparent 2.2px);background-size:46px 46px}
.hl{position:absolute;left:-500px;width:1000px;text-align:center;direction:rtl;color:#fff;font-weight:800;line-height:1.14}
.hl span{display:inline-block;margin:0 .12em}
.hl .k{color:#5cc8ff}
#ph{width:600px;height:1261px;border-radius:94px;background:#05070d;box-shadow:0 0 0 3px #2b3446,0 50px 120px rgba(0,0,0,.6)}
#scr{position:absolute;left:16px;top:16px;width:568px;height:1229px;border-radius:80px;overflow:hidden;background:#0b1220}
#scr img{position:absolute;left:0;top:0;width:568px}
#notch{position:absolute;left:230px;top:30px;width:140px;height:40px;border-radius:20px;background:#05070d}
.tap{position:absolute;border-radius:50%;pointer-events:none}
.po{position:absolute;left:0;top:0;background-repeat:no-repeat}
#lg{width:250px;height:250px;border-radius:70px;background:linear-gradient(135deg,#3b82f6,#1e3a8a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:122px;box-shadow:0 0 0 2px rgba(255,255,255,.18) inset,0 30px 80px rgba(37,99,235,.55)}
.tx{direction:rtl;white-space:nowrap;font-weight:800}
#url{height:124px;padding:0 64px;border-radius:62px;background:#fff;color:#1e3a8a;font-size:74px;font-weight:800;display:flex;align-items:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#btn{width:560px;height:124px;border-radius:62px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:22px;direction:rtl;box-shadow:0 20px 60px rgba(37,99,235,.6)}
</style>

<div data-slot="world">
  <div id="bg"><div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="dots"></div></div>
  <div class="E" id="ph"><div id="scr">
    <img id="i_index" src="LIVE/index_top.png">
    <img id="i_sys" src="LIVE/sys_home.png"><img id="i_hub" src="LIVE/t_hub.png"><img id="i_yts" src="LIVE/t_yoni1.png"><img id="i_yoni" src="LIVE/t_yoni2.png">
    <img id="i_q" src="LIVE/q_view.png"><img id="i_hint" src="LIVE/q_hint.png"><img id="i_q2" src="LIVE/q_view.png"><img id="i_sol1" src="LIVE/q_sol1.png"><img id="i_sol2" src="LIVE/q_sol2.png"><img id="i_ok" src="LIVE/q_correct.png">
    <img id="i_ex" src="LIVE/ex_q2.png"><img id="i_mil" src="LIVE/mil_1.png"><img id="i_h2h" src="LIVE/h2h_1.png">
    <div id="rings"></div><div class="tap" id="tp1"></div><div class="tap" id="tp2"></div>
  </div><div id="notch"></div></div>
  <div id="pops"></div>
  <div class="E" id="lg"><span class="fa">GRAD</span></div>
  <div class="E tx" id="nm" style="font-size:70px;color:#fff">המרכז להישגים לימודיים</div>
  <div class="E" id="url">tirgulim.co.il</div>
  <div class="E" id="btn"><span class="fa" style="font-size:44px">USERPLUS</span>הצטרפו עכשיו</div>
  <div id="hls"></div>
</div><!--/world-->
<div data-slot="shape"></div><!--/shape-->

<script>
const $=id=>document.getElementById(id);
const S=M.S, cl=M.clamp;
const sp=(t,t0,w=13,z=0.8)=>S(t-t0,w,z);
const io=(t,a,b,w=13)=>sp(t,a,w,0.8)*(b==null?1:1-S(t-b,15,1));
const put=(el,x,y,s=1,o=1,extra='')=>{el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(-50%,-50%) scale(${s.toFixed(4)})${extra}`;el.style.opacity=cl(o).toFixed(3);el.style.display=o<0.003?'none':'';};

// ---- voice-over lines = on-screen transcript (all wording from the site)
const L=[[0.3,2.6,'המרכז להישגים לימודיים',['להישגים'],78],
 [2.8,5.5,'לומדים חכם, מצליחים בגדול.',['מצליחים','בגדול.'],80],
 [5.7,8.0,'בוחרים מקצוע – ומתחילים להתקדם',['מקצוע'],74],
 [8.1,11.0,'מורה פרטי לכל תחום',['מורה','פרטי'],86],
 [11.1,13.4,'ושיעור קולי חי, אחד על אחד',['קולי','חי,'],68],
 [13.5,15.7,'שאלות לפי נושא, מהמאגר האמיתי',['שאלות'],74],
 [15.8,18.2,'נתקעתם? לוחצים על רמז',['רמז'],86],
 [18.3,20.6,'ופתרון מלא – שלב אחר שלב',['פתרון','מלא'],70],
 [20.7,22.0,'תשובה נכונה! כל הכבוד.',['נכונה!'],80],
 [22.1,24.8,'מבחן – סימולציה בזמן אמת',['סימולציה'],78],
 [24.9,26.9,'מי רוצה להיות מיליונר?',['מיליונר?'],86],
 [27.0,29.0,'ראש בראש מול תלמידים אחרים',['ראש','בראש'],76],
 [29.2,33.2,'הצטרפו עכשיו',['עכשיו'],92]];
const T=33.2;
const wt=(i,j)=>{const [a,b,txt]=L[i], n=txt.split(' ').length, d=Math.min(2.2,(b-a)*0.7); return a+d*j/n;};
$('hls').innerHTML=L.map((l,i)=>`<div class="hl" id="h${i}" style="font-size:${l[4]}px">${l[2].split(' ').map((w,j)=>`<span id="h${i}w${j}" class="${l[3].includes(w)?'k':''}">${w}</span>`).join(' ')}</div>`).join('');

// ---- phone + screens
const K=568/390, PY=212;
const SCR=(x,y,py)=>[-284+x*K, py-614.5+y*K];
// screen id, time it appears (crossfade in)
const SEQ=[['i_index',0],['i_sys',5.6],['i_hub',7.9],['i_yts',9.45],['i_yoni',11.85],['i_q',13.45],['i_hint',15.95],['i_q2',18.0],['i_sol1',18.45],['i_sol2',19.7],['i_ok',20.85],['i_ex',22.05],['i_mil',24.85],['i_h2h',26.95]];
// index page scroll (css px of the site): [time, scrollY]
const scrollY=M.track(0,[[1.7,700,M.SOFT],[3.2,2680,M.SOFT],[4.55,0,[9,1]]]);
// taps on the real buttons (screenshot css px)
const TAPS=[[5.2,95,28],[7.55,39,800],[9.2,195,325],[11.55,276,442],[15.75,280,208],[18.25,110,208],[20.65,195,586]];
// pop-outs: [image, x,y,w,h, in, out]
const PO=[['t_yoni1',201,201,150,280,9.85,10.95],['t_yoni1',39,195,149,280,10.15,10.95],['t_yoni1',201,497,150,280,10.45,10.95],['t_yoni1',39,497,149,280,10.75,11.3],
  ['q_view',26,370,338,163,13.9,15.5],['ex_q2',12,18,366,77,22.6,24.6]];
$('pops').innerHTML=PO.map((p,i)=>`<div class="po E" id="po${i}"></div>`).join('');
PO.forEach((p,i)=>{const e=$('po'+i).style; e.width=p[3]*K+'px'; e.height=p[4]*K+'px'; e.borderRadius=(20*K)+'px';
  e.backgroundImage=`url(LIVE/${p[0]}.png)`; e.backgroundSize=`${390*K}px auto`; e.backgroundPosition=`${-p[1]*K}px ${-p[2]*K}px`;});
$('rings').innerHTML=[0,1,2].map(i=>`<div class="tap" id="r${i}" style="border:5px solid #5cc8ff"></div>`).join('');

M.scene({
  W:1080,H:1920,bg:'#0a1633',T,center:[540,960],intro:null,
  SH:{x:{w:10,h:10,r:0,bg:'#0a1633',cam:1}},start:'x',SEQ:[],
  extra:(t)=>{
    const g1=$('g1').style, g2=$('g2').style;
    g1.width=g1.height='1500px'; g1.background='radial-gradient(circle,rgba(37,99,235,.55),rgba(37,99,235,0) 62%)';
    g1.left=(-300+160*Math.sin(t*0.35))+'px'; g1.top=(-420+200*Math.cos(t*0.28))+'px';
    g2.width=g2.height='1200px'; g2.background='radial-gradient(circle,rgba(6,182,212,.28),rgba(6,182,212,0) 62%)';
    g2.left=(200+140*Math.cos(t*0.31))+'px'; g2.top=(900+180*Math.sin(t*0.25))+'px';

    L.forEach((l,i)=>{const el=$('h'+i), out=1-S(t-l[1],18,1), on=t>=l[0]-0.05&&t<l[1]+0.35;
      el.style.display=on?'':'none'; if(!on) return;
      el.style.top=(-760-l[4]*0.58)+'px';
      l[2].split(' ').forEach((w,j)=>{const ti=wt(i,j), v=M.vis(t,ti,null,{din:0,lin:0.26,blur:14}), s=$(`h${i}w${j}`).style;
        s.opacity=(v.o*out).toFixed(3); s.filter=v.blur>0.05?`blur(${v.blur.toFixed(1)}px)`:'none';
        s.transform=`translateY(${((1-v.a)*34-(1-out)*28).toFixed(1)}px)`;});});

    // phone in at start, out for the CTA; a gentle push-in while a modal is open
    const phIn=sp(t,0.15,10,0.82), phOut=S(t-29.05,11,1);
    const push=0.05*(io(t,16.0,18.0,9)+io(t,18.5,20.6,9));
    const py=PY+(1-phIn)*1500+phOut*1500, ps=1+push;
    put($('ph'),0,py,ps,phIn>0.002&&phOut<0.999?1:0);
    SEQ.forEach(([id,ti],k)=>{const nx=SEQ[k+1]; const a=cl((t-ti)/0.22), b=nx?cl((t-nx[1]-0.22)/0.01):0; $(id).style.opacity=(k==0?1:a)*(1-b);});
    $('i_index').style.transform=`translateY(${(-scrollY(t)*K).toFixed(1)}px)`;
    // taps: ring + dot on the real button
    let tk=0; TAPS.forEach(([ti,x,y])=>{const d=t-ti; if(d<-0.25||d>0.55) return; const e=$(tk?'tp2':'tp1').style; tk++; e.display='';
      const k=cl(d/0.5), r=40+90*M.eo(k), pre=cl((d+0.25)/0.25);
      e.left=(x*K-r)+'px'; e.top=(y*K-r)+'px'; e.width=e.height=2*r+'px';
      e.background=`rgba(255,255,255,${(d<0?0.35*pre:0.35*(1-k)).toFixed(3)})`; e.border=`4px solid rgba(255,255,255,${(d<0?0.9*pre:0.9*(1-k)).toFixed(3)})`;});
    ['tp1','tp2'].slice(tk).forEach(id=>$(id).style.display='none');
    // voice rings around the tutor photo
    [0,1,2].forEach(i=>{const ph=((t-11.85)/1.3+i/3)%1, on=t>11.95&&t<13.45, d=300+240*ph, r=$('r'+i).style, cx=195*K, cy=125*K;
      r.left=(cx-d/2)+'px'; r.top=(cy-d/2)+'px'; r.width=r.height=d+'px'; r.opacity=on?(0.7*(1-ph)).toFixed(3):0;});
    // pop-outs lift out of the screen
    PO.forEach((p,i)=>{const a=io(t,p[5],p[6],16), [x,y]=SCR(p[1]+p[3]/2,p[2]+p[4]/2,py);
      put($('po'+i),x*ps,(y-py)*ps+py,(1+0.14*a)*ps,a>0.01?1:0,` translateY(${(-22*a).toFixed(1)}px)`);
      $('po'+i).style.boxShadow=`0 ${30*a}px ${70*a}px rgba(0,0,0,${0.5*a}),0 0 0 ${3*a}px rgba(92,200,255,.9)`;});

    // CTA
    const lA=sp(t,29.3,12,0.72), nA=sp(t,29.6), uA=sp(t,30.1,13,0.7), bA=sp(t,30.6,13,0.7);
    put($('lg'),0,-150,(0.5+0.5*lA)*(1+0.02*Math.sin(t*2)),lA);
    put($('nm'),0,80,1,nA,` translateY(${((1-nA)*30).toFixed(1)}px)`);
    put($('url'),0,290+(1-uA)*60,0.85+0.15*uA,uA);
    const press=M.presses([31.6])(t);
    put($('btn'),0,480+(1-bA)*60,(0.85+0.15*bA)*(1-0.05*press)*(1+0.03*Math.sin(Math.max(0,t-31.8)*4)),bA);
    $('cursor').style.opacity=t>30.9&&t<32.9?Math.min(cl((t-30.9)/0.2),cl((32.9-t)/0.3)):0;
  },
  cursor:{size:64,clicks:[31.6],keys:[[0,330,860],[30.9,330,860],[31.45,60,500],[33.2,60,500]]},
});
</script>
