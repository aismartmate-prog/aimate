<script>
const $=id=>document.getElementById(id);
const S=M.S, cl=M.clamp;
const sp=(t,t0,w=13,z=0.8)=>S(t-t0,w,z);
const io=(t,a,b,w=13)=>sp(t,a,w,0.8)*(b==null?1:1-S(t-b,15,1));
const put=(el,x,y,s=1,o=1,extra='')=>{el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(-50%,-50%) scale(${s.toFixed(4)})${extra}`;el.style.opacity=cl(o).toFixed(3);el.style.display=o<0.003?'none':'';};
const T=47;
const TURN=14.0;

// ---- the voice-over script, shown on screen. [start,end,text,keys,size,style] style: 'type' = typewriter (act 1)
const L=[[0.6,4.8,'עוד ערב של שיעורי בית...',[],80,'type'],
 [5.2,7.6,'עוד שיעור פרטי. ועוד אחד.',[],80,'type'],
 [7.8,9.9,'והחשבון רק גדל.',['גדל.'],86,'type'],
 [10.1,13.5,'אלפי שקלים בחודש על מורים פרטיים?',['אלפי','שקלים','בחודש'],96,'hit'],
 [14.5,17.0,'יש דרך אחרת.',['אחרת.'],96,'pop'],
 [17.2,21.4,'מערכת למידה מתקדמת – מכיתה א׳ ועד הבגרות',['מתקדמת'],74,'pop'],
 [21.6,23.7,'נתקעתם ב-11 בלילה?',['11'],90,'pop'],
 [23.8,26.0,'מורה פרטי מבוסס AI – זמין 24/7',['מורה','פרטי'],78,'pop'],
 [26.2,30.0,'פתרונות מלאים, צעד אחר צעד',['צעד','אחר'],80,'pop'],
 [30.2,32.6,'במקום לשלם אלפי שקלים בחודש למורים פרטיים',[],70,'pop'],
 [32.7,35.0,'קבלו את הכל במערכת אחת מתקדמת.',['אחת'],80,'pop'],
 [37.6,41.5,'פגישת ייעוץ ללא עלות וללא התחייבות',['ללא','עלות'],76,'pop'],
 [41.6,47,'השאירו פרטים ונחזור אליכם',['השאירו','פרטים'],78,'pop']];
$('lines').innerHTML=L.map((l,i)=>`<div class="ln" id="l${i}" style="font-size:${l[4]}px">${l[2].split(' ').map((w,j)=>`<span id="l${i}w${j}" class="${l[3].includes(w)?(l[5]==='hit'?'r':'k'):''}">${l[5]==='type'?[...w].map((c,m)=>`<em id="l${i}w${j}c${m}" style="font-style:normal">${c}</em>`).join(''):w}</span>`).join(' ')}</div>`).join('');

// ---- bills that pile up on the table (act 1), rain (act 1 climax), coins from the wallet
const BILL=Array.from({length:9},(_,i)=>({x:-250+((i*137)%380),y:335-i*14,r:((i*53)%30)-15,t:1.2+i*0.42}));
$('bills').innerHTML=BILL.map((b,i)=>`<div class="bill" id="b${i}"><b>₪</b><i style="top:50px;width:80px"></i><i style="top:64px;width:54px"></i></div>`).join('');
const RAIN=Array.from({length:26},(_,i)=>({x:-500+((i*211)%1000),d:(i*0.37)%2.6,r:((i*71)%60)-30,v:700+((i*97)%400)}));
$('rain').innerHTML=RAIN.map((b,i)=>`<div class="bill" id="rn${i}" style="opacity:.9"><b>₪</b><i style="top:50px;width:80px"></i><i style="top:64px;width:54px"></i></div>`).join('');
// calendar: 5 weeks x 7 days, lessons pop on 12 days
const LES=[2,4,6,9,11,13,16,18,20,23,25,27];
$('cells').innerHTML=Array.from({length:35},(_,i)=>{const c=i%7,r=Math.floor(i/7);return `<div class="cell" style="right:${30+c*116}px;top:110px;transform:translateY(${r*124}px)"><b>${i<30?i+1:''}</b>${LES.includes(i)?`<div class="les" id="le${i}">שיעור פרטי</div>`:''}</div>`}).join('');
const LT=LES.map((d,k)=>5.4+k*0.36);
$('coins').innerHTML=LES.map((d,k)=>`<div class="coin" id="co${k}">₪</div>`).join('');
const cellPos=i=>{const c=i%7,r=Math.floor(i/7);return [430-30-c*116-55, -380+110+r*124+52-60];}; // world coords of a cell centre (cal centred at 0,-60)
// pins for "nationwide"
const PINS=Array.from({length:14},(_,i)=>({x:-360+((i*263)%720),y:-260+((i*149)%520),t:35.4+i*0.08}));
$('pins').innerHTML=PINS.map((p,i)=>`<div class="E pin fa" id="pn${i}">PIN</div>`).join('');

const SHOTS=[['s_idx',17.3],['s_sys',19.2],['s_tut',21.6],['s_yoni',23.8],['s_hint',26.2],['s_sol',27.5],['s_ok',28.8]];

M.scene({
  W:1080,H:1920,bg:'#07090f',T,center:[540,960],intro:null,
  SH:{x:{w:10,h:10,r:0,bg:'#07090f',cam:1}},start:'x',SEQ:[],
  extra:(t)=>{
    // night -> day background at the turn
    const day=cl((t-TURN)/0.6); $('bgD').style.opacity=day.toFixed(3);
    const fl=t>=TURN-0.05&&t<TURN+0.7?Math.max(0,1-(t-TURN)/0.7):0; $('flash').style.opacity=fl.toFixed(3);
    const black=t>13.55&&t<TURN?1:0;

    // lines
    L.forEach((l,i)=>{const el=$('l'+i), on=t>=l[0]-0.05&&t<l[1]+0.35; el.style.display=on?'':'none'; if(!on) return;
      const out=1-S(t-l[1],16,1); el.style.top=(-760-l[4]*0.6)+'px';
      if(l[5]==='hit'){const sh=t<l[0]+0.6?Math.sin(t*90)*14*(1-(t-l[0])/0.6):0; el.style.transform=`translateX(${sh.toFixed(1)}px)`;}
      else el.style.transform='';
      const ws=l[2].split(' '); const total=[...l[2].replace(/ /g,'')].length; let ci=0;
      ws.forEach((w,j)=>{const s=$(`l${i}w${j}`).style;
        if(l[5]==='type'){[...w].forEach((c,m)=>{const ti=l[0]+ci*0.055; ci++; $(`l${i}w${j}c${m}`).style.opacity=(t>=ti?1:0)*out;}); s.opacity=1; return;}
        const d=l[5]==='hit'?0.5:Math.min(1.5,(l[1]-l[0])*0.55), ti=l[0]+d*j/ws.length;
        const v=M.vis(t,ti,null,{din:0,lin:l[5]==='hit'?0.12:0.24,blur:12}); s.opacity=(v.o*out).toFixed(3); s.filter=v.blur>0.05?`blur(${v.blur.toFixed(1)}px)`:'none';
        s.transform=l[5]==='hit'?`scale(${(1+0.5*(1-v.a)).toFixed(3)})`:`translateY(${((1-v.a)*30).toFixed(1)}px)`;});
      el.style.opacity=black?0:1;});

    // kitchen scene: night 0-10, back as day 30-35
    const kN=io(t,0.05,5.0,9), kD=io(t,30.1,35.2,9);
    const k=Math.max(kN,kD), sw=$('svgwrap').style; sw.opacity=k.toFixed(3); sw.display=k<0.003?'none':'';
    sw.transform=`translateY(${((1-k)*80).toFixed(1)}px) scale(${(0.96+0.04*k+0.02*Math.sin(t*0.4)).toFixed(4)})`;
    const isDay=t>20; $('skyd').style.opacity=isDay?1:0; $('moon').style.opacity=isDay?0:1; $('moonc').style.opacity=isDay?0:1; $('sun').style.opacity=isDay?1:0;
    $('wall').setAttribute('fill',isDay?'#e8eef7':'#161c2c');
    $('lcone').style.opacity=isDay?0:(0.85+0.15*Math.sin(t*23)*Math.sin(t*7));
    $('armN').style.opacity=isDay?0:1; $('handN').style.opacity=isDay?0:1; $('armD').style.opacity=isDay?1:0; $('handD').style.opacity=isDay?1:0;
    $('kid').style.opacity=isDay?cl((t-30.6)/0.4):0; $('dlap').style.opacity=isDay?cl((t-30.4)/0.4):0; $('props').style.opacity=isDay?0:1;
    $('sh').setAttribute('transform',`rotate(${Math.floor(t)*6})`);
    $('hh').setAttribute('d',isDay?'M0 0 L36 -24':'M0 0 L-24 -40');
    $('mom').setAttribute('transform',`translate(0 ${(isDay?0:2*Math.sin(t*1.4)).toFixed(2)})`);
    // bills land on the table (night), fly away (day)
    BILL.forEach((b,i)=>{const e=$('b'+i); const a=sp(t,b.t,12,0.7); const away=t>30?S(t-30.3-i*0.05,9,1):0;
      const on=(t<10.2&&t>b.t)||(t>30&&away<0.999);
      put(e,b.x+away*(600+i*40),b.y-(1-a)*500-away*700,1,on?(t<30?Math.min(1,kN*2):1-away):0,` rotate(${(b.r+away*200).toFixed(1)}deg)`);});

    // calendar + wallet + coins
    const cA=io(t,5.05,10.0,12);
    put($('cal'),0,-60+(1-cA)*120,0.9+0.1*cA,cA);
    LES.forEach((d,kk)=>{const e=$('le'+d); const a=sp(t,LT[kk],18,0.6); e.style.opacity=t>LT[kk]?1:0; e.style.transform=`scale(${(0.4+0.6*a).toFixed(3)})`;
      const ct=t-LT[kk]+0.35, c=$('co'+kk), [tx,ty]=cellPos(d);
      if(ct<0||ct>0.35||cA<0.5){c.style.display='none';} else {const u=M.eio(ct/0.35); c.style.display=''; c.style.transform=`translate(${(0+(tx-0)*u-22).toFixed(1)}px,${(560+(ty-560)*u-140*Math.sin(Math.PI*u)-22).toFixed(1)}px)`;}});
    const nCoins=LT.filter(x=>t>x).length;
    put($('wallet'),0,560,(0.75+0.5*cA)*(1-0.025*nCoins),cA);

    // bill rain behind the big line
    RAIN.forEach((b,i)=>{const e=$('rn'+i), u=t-10.1-b.d*0.35; if(u<0||t>13.55){e.style.display='none';return;} e.style.display='';
      e.style.transform=`translate(${(b.x).toFixed(1)}px,${(-1000+b.v*u).toFixed(1)}px) rotate(${(b.r+u*120).toFixed(1)}deg)`;});

    // brand reveal
    const bA=io(t,TURN+0.1,17.1,11);
    put($('lg'),0,-120,(0.5+0.5*bA)*(1+0.02*Math.sin(t*2)),bA);
    put($('bn'),0,90,1,io(t,TURN+0.4,17.1),` translateY(${((1-io(t,TURN+0.4,17.1))*30).toFixed(1)}px)`);

    // laptop with the site
    const lA=io(t,17.15,30.0,10);
    put($('lap'),0,-70+(1-lA)*400,(0.98+0.1*lA),lA);
    SHOTS.forEach(([id,ti],kk)=>{const nx=SHOTS[kk+1]; const a=kk?cl((t-ti)/0.25):1, b=nx?cl((t-nx[1]-0.25)/0.01):0; $(id).style.opacity=(a*(1-b)).toFixed(3);});
    // slow scroll on the index, gentle zoom on modals
    const ZM=[['s_tut',21.7,2.25,720,490],['s_yoni',23.9,1.7,600,440],['s_hint',26.3,2.6,720,440],['s_sol',27.6,1.6,720,480],['s_ok',28.9,1.5,820,560]];
    ZM.forEach(([id,ti,z,fx,fy])=>{const a=M.eio(cl((t-ti)/0.9)), zz=1+(z-1)*a, e=$(id).style; e.transformOrigin=`${fx*880/1440}px ${fy*880/1440}px`; e.transform=`scale(${zz.toFixed(4)})`;});
    const k2=io(t,21.65,23.75,14); put($('clk2'),0,-420+(1-k2)*-60,0.7+0.3*k2,k2); $('sh2').setAttribute('transform',`rotate(${Math.floor(t)*6})`);
    $('s_idx').style.transform=`translateY(${(-Math.max(0,t-17.6)*60).toFixed(1)}px)`;
    const c1=io(t,23.9,26.1,12); put($('c247'),260,420+(1-c1)*40,0.9+0.1*c1,c1);
    const c2=io(t,32.9,35.2,12); put($('cfam'),0,640+(1-c2)*40,0.9+0.1*c2,c2);
    // the clock comes back at 11pm
    const ck=io(t,21.6,23.75,14);
    $('clock').setAttribute('transform',`translate(830 230)`);

    // nationwide
    const nA=io(t,35.25,37.5,12);
    put($('nat'),0,-40,0.9+0.1*nA,nA); put($('nat2'),0,110,1,io(t,35.7,37.5),` translateY(${((1-io(t,35.7,37.5))*20).toFixed(1)}px)`);
    PINS.forEach((p,i)=>{const a=io(t,p.t,37.5,16); put($('pn'+i),p.x,p.y+(p.y>-80&&p.y<180?(p.y<50?-190:190):0),0.6+0.4*a,a*0.85,` translateY(${((1-a)*-40).toFixed(1)}px)`);});

    // CTA
    const fA=sp(t,37.8,11,0.8);
    put($('form'),0,-90+(1-fA)*300,(0.9+0.1*fA)*1.12,fA);
    [['k1',38.7],['k2',39.1],['k3',39.5]].forEach(([id,ti],kk)=>{const a=sp(t,ti,14,0.75); put($(id),0,420+kk*78+(1-a)*30,1,a*(t<41.4?1:1-cl((t-41.4)/0.3)));});
    const wA=sp(t,41.6,12,0.7), pulse=1+0.035*Math.max(0,Math.sin((t-42.2)*4.2));
    put($('wa'),0,500+(1-wA)*120,(0.85+0.15*wA)*(t>42.2?pulse:1),wA);
  },
});
</script>
