    <script>
      // בדיקת קאש חכמה (מסונכרן עם התיקון בעמוד הבית): מוחקים עוגיות וקאש
      // ישן רק כאשר יש גרסה חדשה בפועל אחרי דיפלוי - לא בכל טעינה, כדי לא
      // להרוג את יתרון הקאשינג הרגיל בדפדפן (ראו הסבר מלא בעמוד הבית).
      var SITE_VERSION = '2026-08-17';
      (function () {
        try {
          var stored = localStorage.getItem('__siteVersion');
          if (stored === SITE_VERSION) return;
          document.cookie.split(';').forEach(function (c) {
            var name = c.split('=')[0].trim();
            if (!name) return;
            var expire = 'expires=Thu, 01 Jan 1970 00:00:00 UTC;';
            document.cookie = name + '=; ' + expire + ' path=/;';
            document.cookie = name + '=; ' + expire + ' path=/; domain=' + location.hostname + ';';
          });
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            }).catch(function () {});
          }
          localStorage.setItem('__siteVersion', SITE_VERSION);
        } catch (e) {}
      })();
    </script>

<style>
        :root {
            --bg: #f5f6fb; --card: #fff; --text: #172036; --muted: #667089; --line: #e5e8f1; --brand: #6d28d9; --brand-2: #4f46e5;

        /* ---------- סרגל עליון ---------- */

            background: radial-gradient(900px 420px at 85% -10%, rgba(139,92,246,.55), transparent 60%), radial-gradient(700px 380px at 5% 110%, rgba(6,182,212,.35), transparent 60%), linear-gradient(135deg, #0b1030, #1e1b4b 55%, #2e1065); }
        .hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px); background-size: 22px 22px; opacity: .7; pointer-events: none; }

        /* ---------- מבנה ראשי ---------- */
        .shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 28px; padding-bottom: 70px; }

        .steps { display: flex; flex-direction: column; gap: 4px; }
        .step { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; background: transparent; border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; color: var(--text); position: relative; }
        .step:hover { background: #f6f7fb; }
        .step .n { width: 30px; height: 30px; border-radius: 10px; background: #eef0f7; color: var(--muted); font-weight: 800; font-size: .82rem; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .step.done .ok { opacity: 1; } .step.done .n { background: #dcfce7; color: #166534; }
        .step.active { background: var(--sec-bg); border-color: transparent; }
        .step.active::before { content: ""; position: absolute; right: -14px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--sec-color); }
        .step.active .n { background: var(--sec-color); color: #fff; }

        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 32px 24px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .panel::before { content: ""; position: absolute; top: 0; right: 0; left: 0; height: 4px; background: var(--sec-color, var(--brand)); }
        .panel[hidden] { display: none; }
        .panel-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
        .panel-head .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--sec-bg); color: var(--sec-color); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .panel-head .ey { font-size: .76rem; font-weight: 800; color: var(--sec-color); letter-spacing: .02em; }
        .panel-head h2 { margin: 0; font-size: 1.55rem; font-weight: 900; line-height: 1.2; }

        .ls-body { font-size: 1rem; }

        .ls-body .muted, .muted { color: var(--muted); font-size: .82rem; }
        .pt-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
        .pt-list li { background: var(--sec-bg); border-radius: 14px; padding: 14px 16px; display: flex; gap: 11px; align-items: flex-start; border: 1px solid rgba(0,0,0,.03); }

        .pt-list li b { color: var(--sec-color); }

        .steps-ol li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--sec-color); color: #fff; font-weight: 800; font-size: .84rem; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .ex-step .m { direction: ltr; text-align: center; overflow-x: auto; }

        .opt { text-align: right; font-size: .98rem; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 52px; }
        .opt:hover:not(:disabled) { border-color: var(--sec-color); background: var(--sec-bg); }

        .media-card:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(60,40,160,.45); border-color: #c4b5fd; }
        .media-card:disabled { opacity: .8; cursor: default; }
        .media-card .thumb { width: 92px; height: 64px; border-radius: 13px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.15rem; overflow: hidden; }
        .media-card.video .thumb { background: repeating-linear-gradient(to bottom, #fffdf7 0, #fffdf7 13px, #bfdbfe 13px, #bfdbfe 14px); }
        .media-card.video .thumb::after { content: ""; position: absolute; top: 0; bottom: 0; right: 14px; width: 1px; background: rgba(239,68,68,.5); }
        .media-card.video .thumb i { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #06b6d4); display: flex; align-items: center; justify-content: center; font-size: .85rem; box-shadow: 0 6px 14px -4px rgba(109,40,217,.7); padding-right: 0; }
        .media-card.live .thumb { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
        .media-card.live.playing .thumb { background: linear-gradient(135deg, #ef4444, #be123c); }
        .media-card .mt { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
        .media-card .mt b { font-weight: 900; font-size: 1rem; } .media-card .mt small { color: var(--muted); font-size: .8rem; font-weight: 600; }
        .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .alt-btn, .seen-btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 800; font-size: .88rem; border-radius: 12px; padding: 9px 16px; background: #fff; color: var(--text); border: 1.5px solid var(--line); min-height: 40px; }
        .alt-btn:hover, .seen-btn:hover { border-color: var(--sec-color, #94a3b8); }

        .live-tx { margin-top: 2px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 14px; padding: 10px 16px; }
        .live-tx summary { cursor: pointer; font-weight: 800; color: #075985; }
        .live-tx .tx { margin-top: 8px; white-space: pre-line; font-size: .95rem; }
        .live-tx[hidden] { display: none; }

        .panel-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
        .nav-btn { border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 14px; padding: 12px 24px; font-weight: 800; font-size: .95rem; cursor: pointer; min-height: 48px; box-shadow: var(--shadow); }
        .nav-btn.primary { background: linear-gradient(135deg, #6d28d9, #4f46e5); border-color: transparent; color: #fff; }
        .nav-btn[disabled] { opacity: .35; cursor: default; }
        .practice-cta { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; background: linear-gradient(135deg, #0b1030, #4c1d95); color: #fff; text-decoration: none; border-radius: 18px; padding: 20px; font-weight: 800; font-size: 1.02rem; box-shadow: var(--shadow); }

        .hero .vid-btn, .vid-btn { display: inline-flex; align-items: center; gap: 9px; border: none; cursor: pointer; font-weight: 800; font-size: .95rem; border-radius: 12px; padding: 12px 22px; background: #fff; color: #4c1d95; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); }
        .quiz-solution .vid-btn { background: linear-gradient(135deg, #8b5cf6, #06b6d4); color: #fff; padding: 9px 16px; font-size: .86rem; margin-top: 10px; }

        @media (max-width: 960px) {

            .steps { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
            .steps::-webkit-scrollbar { display: none; }
            .step { width: auto; flex: 0 0 auto; padding: 7px 12px 7px 10px; border: 1.5px solid var(--line); border-radius: 999px; gap: 8px; }
            .step .t small, .step .ok { display: none; }
            .step .n { width: 24px; height: 24px; border-radius: 50%; font-size: .74rem; }
            .step.active { background: var(--sec-color); color: #fff; border-color: var(--sec-color); }
            .step.active::before { display: none; }
            .step.active .n { background: rgba(255,255,255,.3); }
            .breadcrumb, .brand .tag { display: none; }
            .hero .in { padding-top: 22px; padding-bottom: 22px; gap: 18px; }
            .hero-stats { width: 100%; } .stat { flex: 1; min-width: 88px; padding: 11px 12px; } .ring { width: 92px; height: 92px; }

            .panel-head h2 { font-size: 1.3rem; }
            .quiz-grid { grid-template-columns: 1fr; } .media-row { grid-template-columns: 1fr; }

        /* ===== התאמת סלולר מלאה (v2) ===== */
        @media (max-width: 960px) {
            .shell { grid-template-columns: minmax(0, 1fr) !important; }
            .shell > * { min-width: 0; }
            .pt-list, .steps-ol { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }

            .panel mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
            .panel pre, .panel table { display: block; max-width: 100%; overflow-x: auto; }
        }
        @media (max-width: 600px) {
            body { -webkit-text-size-adjust: 100%; }
            .wrap, .shell, .hero .in { padding-left: 14px; padding-right: 14px; }
            .hero h1 { font-size: 1.7rem; line-height: 1.25; }
            .hero .in { gap: 14px; }
            .hero-stats { gap: 8px; } .stat { min-width: 0; padding: 10px; } .stat b { font-size: 1.25rem; }
            .ring { width: 80px; height: 80px; }
            .outline { top: 54px; margin: 0 -2px; }
            .steps { padding-bottom: 2px; scroll-snap-type: x proximity; }
            .step { scroll-snap-align: center; min-height: 40px; }
            .panel { padding: 18px 14px 16px; }
            .panel-head { flex-wrap: wrap; gap: 10px; }
            .panel-head h2 { font-size: 1.25rem; }
            .panel .ls-body, .panel p { font-size: 1.04rem; line-height: 1.8; }

<script>
    const IDB_NAME = 'yoniLearnCache';
    const IDB_STORE = 'lessons';

    function idbOpen() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains(IDB_STORE)) {
                    req.result.createObjectStore(IDB_STORE);
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function idbGet(key) {
        try {
            const db = await idbOpen();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn('[למד אותי] מטמון קבוע לא זמין (idbGet):', e);
            return null;
        }
    }

    async function idbSet(key, value) {
        try {
            const db = await idbOpen();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            console.warn('[למד אותי] שמירה למטמון קבוע נכשלה (idbSet):', e);
        }
    }

    // =====================================================================================
    // מנוע השמע/החיבור הקולי - פורט ישירות מ-practice.html (אותו מנגנון בדיוק שמפעיל את
    // כפתורי רמז/פתרון מלא/דוגמה מוחשית שם, ומוכח כעובד). "למד אותי" משתמש באותה שיחה
    // חיה עם יוני, עם actionType='teach-topic' חדש בשרת. ההפעלה בפועל (שליחת הבקשה
    // ותחילת הדיבור) קורית רק בלחיצת התלמיד על "התחילו את השיעור" - אבל את החיבור
    // עצמו (טוקן + WebSocket + setup) פותחים כבר ברקע מיד עם טעינת העמוד, כך שברגע
    // שהתלמיד באמת לוחץ, הכל כבר מוכן ומרגיש מיידי לגמרי.
    // =====================================================================================
    window.yoniAudioCtx = null;
    window.yoniOutputGain = null;
    window.nextAudioTime = 0;
    window.yoniActiveSources = [];
    window.yoniAudioGen = 0;
    window.yoniLastSentGen = 0;
    window.yoniResponseActive = false;
    window.yoniSetupComplete = false;
    window.yoniSocket = null;
    window.yoniConnectPromise = null;
    window.yoniActiveSectionHelpKey = null;  // מפתח החלק שכרגע טוען/מתנגן, אם יש
    window.yoniSectionRunningText = '';      // תמלול מצטבר של הבקשה הפעילה כרגע
    window.yoniSectionRunningChunks = [];    // מקטעי PCM מצטברים של הבקשה הפעילה כרגע

    function initAudioContext() {
        try {
            if ('audioSession' in navigator) navigator.audioSession.type = 'playback';
        } catch (e) {}
        if (!window.yoniAudioCtx) {
            window.yoniAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            window.yoniOutputGain = window.yoniAudioCtx.createGain();
            window.yoniOutputGain.gain.value = 1.3;
            const limiter = window.yoniAudioCtx.createDynamicsCompressor();
            limiter.threshold.value = -6; limiter.knee.value = 4; limiter.ratio.value = 15;
            limiter.attack.value = 0.002; limiter.release.value = 0.15;
            window.yoniOutputGain.connect(limiter);
            limiter.connect(window.yoniAudioCtx.destination);
        }
        if (window.yoniAudioCtx.state === 'suspended') window.yoniAudioCtx.resume();
        // "טריק" ידוע לפתיחת נעילת שמע ב-Safari/iOS: מנגנים מיד באגר שקט כמעט-
        // ריק. לפעמים resume() לבדו לא מספיק לשחרר בפועל את חומרת השמע במכשיר -
        // צריך ניגון אמיתי, ולו רגעי, בתוך אותה מחוות-משתמש כדי שזה "יתפוס".
        try {
            const unlockBuffer = window.yoniAudioCtx.createBuffer(1, 1, window.yoniAudioCtx.sampleRate);
            const unlockSource = window.yoniAudioCtx.createBufferSource();
            unlockSource.buffer = unlockBuffer;
            unlockSource.connect(window.yoniAudioCtx.destination);
            unlockSource.start(0);
        } catch (e) {}
    }

    function playAudioChunk(base64Data) {
        initAudioContext();
        try {
            const binaryString = atob(base64Data);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            const pcm16 = new Int16Array(bytes.buffer);
            const frameCount = pcm16.length;
            const audioBuffer = window.yoniAudioCtx.createBuffer(1, frameCount, 24000);
            const channelData = audioBuffer.getChannelData(0);
            for (let i = 0; i < frameCount; i++) channelData[i] = pcm16[i] / 32768;

            const source = window.yoniAudioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(window.yoniOutputGain);

            const startAt = Math.max(window.nextAudioTime, window.yoniAudioCtx.currentTime);
            source.start(startAt);
            window.nextAudioTime = startAt + audioBuffer.duration;
            window.yoniActiveSources.push(source);
            source.onended = () => {
                window.yoniActiveSources = window.yoniActiveSources.filter(s => s !== source);
                if (window.yoniActiveSources.length === 0 && !window.yoniResponseActive) {
                    onAllAudioPlaybackEnded();
                }
            };
        } catch (e) {
            console.error('[למד אותי] שגיאה בניגון מקטע שמע:', e);
        }
    }

    function stopYoniAudio() {
        try {
            window.yoniActiveSources.forEach(s => { try { s.onended = null; s.stop(0); } catch (e) {} });
        } catch (e) {}
        window.yoniActiveSources = [];
        window.nextAudioTime = 0;
        window.yoniAudioGen = (window.yoniAudioGen || 0) + 1;
        window.yoniResponseActive = false;
    }

    function closeYoniConnection() {
        try {
            if (window.yoniSocket) {
                window.yoniSocket.onmessage = null;
                window.yoniSocket.onerror = null;
                window.yoniSocket.onclose = null;
                window.yoniSocket.close();
            }
        } catch (e) {}
        window.yoniSocket = null;
        window.yoniSetupComplete = false;
        window.yoniConnectPromise = null;
    }

    function ensureYoniConnection() {
        if (window.yoniSocket && window.yoniSocket.readyState === WebSocket.OPEN && window.yoniSetupComplete) {
            return Promise.resolve(true);
        }
        if (window.yoniConnectPromise) return window.yoniConnectPromise;

        window.yoniConnectPromise = (async () => {
            try {
                const yoniEmail = localStorage.getItem('loggedInEmail') || '';
                const yoniProfileName = localStorage.getItem('activeProfile') || '';
                const yoniSid = (yoniEmail && yoniProfileName) ? (yoniEmail + '::' + yoniProfileName) : (yoniEmail || yoniProfileName || 'learn_user');

                let tokenRes;
                try {
                    tokenRes = await fetch('/live-tutor/api/token?sid=' + encodeURIComponent(yoniSid));
                } catch (fetchErr) {
                    await new Promise((r) => setTimeout(r, 400));
                    tokenRes = await fetch('/live-tutor/api/token?sid=' + encodeURIComponent(yoniSid));
                }
                if (!tokenRes.ok) throw new Error(`שרת ה-token החזיר סטטוס ${tokenRes.status}`);
                const tokenData = await tokenRes.json();
                if (!tokenData.token) throw new Error('לא התקבל טוקן חיבור מהשרת');

                const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${tokenData.token}`;
                window.yoniSocket = new WebSocket(wsUrl);
                window.yoniSetupComplete = false;

                return await new Promise((resolve) => {
                    let settled = false;
                    const safeResolve = (val) => { if (settled) return; settled = true; clearTimeout(setupTimeoutId); resolve(val); };
                    const setupTimeoutId = setTimeout(() => {
                        try { window.yoniSocket.close(); } catch (e) {}
                        safeResolve(false);
                    }, 12000);

                    window.yoniSocket.onopen = () => {
                        const setupMsg = {
                            setup: {
                                model: "models/gemini-3.1-flash-live-preview",
                                generationConfig: {
                                    responseModalities: ["AUDIO"],
                                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: tokenData.voiceName || "Aoede" } } },
                                    // תקרה על אורך התשובה: זו הדלת האחורית הכי יקרה שהייתה
                                    // פתוחה כאן - אין שום הגבלה שמונעת מהמודל "להימשך" ולייצר

                                    maxOutputTokens: 2048

        if (!window.yoniSectionBusy) return;

        window.yoniAudioGen = (window.yoniAudioGen || 0) + 1;
        window.yoniLastSentGen = window.yoniAudioGen;
        window.nextAudioTime = window.yoniAudioCtx ? window.yoniAudioCtx.currentTime : 0;
        window.yoniResponseActive = true;
        window.yoniSectionRunningText = '';
        window.yoniSectionRunningChunks = [];
        setSectionCardVisualState(key, 'live');
        setSectionBtnState(key, 'playing');

            const qaRes = await fetch('/live-tutor/api/quick-action', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },

                    actionType: 'teach-section', focusSectionKey: key, focusSectionLabel: LIVE_LABELS[key] || key,
                    subjectLabel: cfg.subjectLabel, topicLabel: cfg.topicLabel, subtopicLabel: cfg.subtopicLabel,
                    sid: (localStorage.getItem('loggedInEmail') || '') + '::' + (localStorage.getItem('activeProfile') || ''),
                    name: localStorage.getItem('activeProfile') || ''

        } catch (err) {
            console.error('[למד אותי] שגיאה בהבאת חלק:', err);
            window.yoniResponseActive = false; window.yoniSectionBusy = false; window.yoniActiveSectionHelpKey = null;
            setSectionCardVisualState(key, 'idle'); setSectionBtnState(key, 'idle');
            window.LiveUI.error && window.LiveUI.error(key);
        }
    }
    function saveSectionsToCache() { if (window.LIVE_CFG.cacheKey) idbSet(window.LIVE_CFG.cacheKey, { sections: window.yoniSections, savedAt: Date.now() }); }

    }

<script>
(function () {

    // למודל ואין עלות טוקנים: הכל נבנה בדפדפן ומוצג כטקסט + סרטוני לוח.
    //

    // ---------- טעינת קובץ הנתונים (אותו כלל נתיבים כמו בדף התרגול) ----------

    // ---------- נרמול שאלות ----------
    function normalize(raw) {

        sec.actions.innerHTML = '';
        var row = document.createElement('div'); row.className = 'media-row';
        if (!sec.noVideo && r.items.length) {
            var b = mediaCard('video', 'fa-play', 'סרטון הסבר', 'כתיבה על הלוח · כ-' + mmss(estSecs(r.items)));
            b.onclick = function () { playSection(sec); };
            b.onpointerenter = function () { try { WBVideo.prewarm(sectionItems(sec), 5); } catch (e) { } };
            row.appendChild(b);
        }
        if (LIVE_KEYS[sec.key] && topic) {
            var lb = mediaCard('live', 'fa-headphones-simple', 'הסבר קולי מהמורה', 'מורה פרטי · משמיע את החלק בקול');
            lb.onclick = function () { if (typeof playLiveSection === 'function') playLiveSection(sec.key); }; row.appendChild(lb); sec.liveBtn = lb;
        }
        if (row.children.length) sec.actions.appendChild(row);
        var tools = document.createElement('div'); tools.className = 'tools';
        if (sec.alt) {
            var c = document.createElement('button'); c.className = 'alt-btn'; c.innerHTML = '<i class="fa-solid fa-shuffle"></i> דוגמה אחרת';
            c.onclick = function () { exState[sec.key]++; fill(sec); }; tools.appendChild(c);
        }
        var sp = document.createElement('span'); sp.className = 'spacer'; tools.appendChild(sp);
        var sb = document.createElement('button'); sb.className = 'seen-btn'; sb.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span></span>';
        sb.onclick = function () { markSeen(sec.key, !seen[sec.key]); }; tools.appendChild(sb); sec.seenBtn = sb;
        sec.actions.appendChild(tools);
        var tx = document.createElement('details'); tx.className = 'live-tx'; tx.hidden = true; tx.innerHTML = '<summary>תמליל ההסבר הקולי</summary><div class="tx"></div>';
        sec.actions.appendChild(tx); sec.tx = tx;
        if (sec.quiz) renderQuiz(sec);
        refreshSeen();
        typeset(sec.card);
    }
    function renderQuiz(sec) {
        var score = { done: 0, right: 0 }, total = sec.quiz.length;
        var chip = document.createElement('div'); chip.className = 'score-chip'; chip.textContent = 'ענו על 0 מתוך ' + total;
        sec.body.innerHTML = '';
        var grid = document.createElement('div'); grid.className = 'quiz-grid'; sec.body.appendChild(grid);
        sec.quiz.forEach(function (q, qi) {
            var box = document.createElement('div'); box.className = 'quiz-q';
            box.innerHTML = '<div class="qt">' + (qi + 1) + '. ' + H(q.text) + '</div><div class="opt-row"></div><div class="quiz-fb"></div><div class="quiz-solution"></div>';
            var row = box.querySelector('.opt-row'), fb = box.querySelector('.quiz-fb');
            q.options.forEach(function (o, oi) {
                var b = document.createElement('button'); b.className = 'opt'; b.innerHTML = '<span>' + H(o) + '</span>';
                b.onclick = function () {
                    Array.prototype.forEach.call(row.children, function (x, xi) { x.disabled = true; if (xi === q.correct) x.classList.add('right'); });
                    var ok = oi === q.correct; if (!ok) b.classList.add('wrong');
                    fb.className = 'quiz-fb ' + (ok ? 'ok' : 'no');
                    fb.innerHTML = ok ? '<i class="fa-solid fa-circle-check"></i> נכון!' : '<i class="fa-solid fa-circle-xmark"></i> לא בדיוק.' + (q.hint && !HINT_DEFAULT.test(q.hint) ? ' רמז: ' + H(q.hint) : '');
                    if (q.steps.length) {
                        var vb = document.createElement('button'); vb.className = 'vid-btn'; vb.innerHTML = '<i class="fa-solid fa-circle-play"></i> הסבר בסרטון';
                        vb.onclick = function () { playVideo(finalizeItems(exampleItems(q), 'single'), 'פתרון · ' + lessonName); };
                        box.querySelector('.quiz-solution').appendChild(vb);
                    }
                    score.done++; if (ok) score.right++;
                    chip.textContent = 'ענו על ' + score.done + ' מתוך ' + total + ' · נכונות: ' + score.right;
                    if (score.done === total) markSeen(sec.key, true);
                    typeset(box);
                };
                row.appendChild(b);
            });
            grid.appendChild(box);
        });
        sec.body.appendChild(chip);
    }

    // ---------- התקדמות ----------
    function markSeen(key, on) { if (on) seen[key] = 1; else delete seen[key]; saveSeen(); refreshSeen(); }
    function refreshSeen() {
        var n = 0;
        sections.forEach(function (s) {
            var on = !!seen[s.key]; if (on) n++;
            if (s.chip) s.chip.classList.toggle('done', on);
            if (s.seenBtn) { s.seenBtn.classList.toggle('on', on); s.seenBtn.querySelector('span').textContent = on ? 'נלמד ✓' : 'סימנתי שהבנתי'; }
        });
        var pct = sections.length ? Math.round(n / sections.length * 100) : 0;
        var lb = $('progress-label'); if (lb) lb.textContent = n + ' / ' + sections.length;
        var f = $('side-fill'); if (f) f.style.width = pct + '%';
        var rg = $('ring-fg'); if (rg) rg.style.strokeDashoffset = String(314.16 * (1 - pct / 100));
        var rp = $('ring-pct'); if (rp) rp.textContent = pct + '%';
    }

    // ---------- חיבור למורה החי (UI) ----------
    window.LIVE_CFG = { cacheKey: ['v2-8sections', subject, grade, topic, subtopic].join('|').toLowerCase(), subjectLabel: subjectLabelMap[subject] || 'לימודים', topicLabel: topicLabel, subtopicLabel: subtopicLabel };
    window.LiveUI = {
        btn: function (key, st) {
            var s = secByKey(key); if (!s || !s.liveBtn) return; var b = s.liveBtn;
            b.disabled = (st === 'loading'); b.classList.toggle('playing', st === 'playing');
            var again = window.yoniSections && window.yoniSections[key];
            var icon = st === 'loading' ? 'fa-spinner fa-spin' : st === 'playing' ? 'fa-stop' : 'fa-headphones-simple';
            var t = st === 'loading' ? 'מתחבר למורה…' : st === 'playing' ? 'עצור הקראה' : (again ? 'השמעה חוזרת' : 'הסבר קולי מהמורה');
            var sub = st === 'loading' ? 'רגע, מכינים את ההסבר' : st === 'playing' ? 'המורה מסביר עכשיו' : (again ? 'מהמטמון · ללא עלות נוספת' : 'מורה פרטי · משמיע את החלק בקול');
            b.innerHTML = '<span class="thumb"><i class="fa-solid ' + icon + '"></i></span><span class="mt"><b>' + t + '</b><small>' + sub + '</small></span>';
        },
        state: function () { },
        transcript: function (key, text) {
            var s = secByKey(key); if (!s || !s.tx) return; s.tx.hidden = false; s.tx.querySelector('.tx').innerHTML = H(text); typeset(s.tx);
        },
        error: function (key) {
            var s = secByKey(key); if (!s || !s.tx) return; s.tx.hidden = false; s.tx.open = true;
            s.tx.querySelector('.tx').textContent = 'לא הצלחנו להתחבר למורה כרגע. אפשר לנסות שוב, או לצפות בסרטון ההסבר.';
        }
    };
    function restoreLive() {
        if (typeof loadLiveCache !== 'function') return;
        loadLiveCache().then(function (map) {
            Object.keys(map).forEach(function (k) { var s = secByKey(k); if (s) { window.LiveUI.transcript(k, map[k].text); window.LiveUI.btn(k, 'idle'); } });
        }).catch(function () { });
    }

    function heroInfo() {
        var vids = sections.filter(function (s) { return s.items && s.items.length && !s.noVideo; }).length;
        $('hero-sub').textContent = 'הסבר כתוב, סרטוני לוח שמראים כל פתרון נכתב שלב אחר שלב, ובדיקה עצמית בסוף - הכל בנוי מהתרגילים של הנושא.';
        $('st-parts').textContent = sections.length; $('st-vids').textContent = vids; $('st-ex').textContent = Q.length;
        var b = document.createElement('button'); b.className = 'vid-btn'; b.innerHTML = '<i class="fa-solid fa-circle-play"></i> צפו בשיעור המלא';
        b.onclick = playFull; $('hero-actions').appendChild(b);
        refreshSeen();
    }
    // מצב אדמין (?warm=1): מפיק ושומר מראש את כל ההקראות של כל סרטוני הנושא, כך שהתלמידים לא ימתינו לכלום
    function warmUI() {
        if (params.get('warm') !== '1') return;
        var w = document.createElement('button'); w.className = 'vid-btn'; w.style.marginInlineStart = '10px'; w.innerHTML = '<i class="fa-solid fa-fire"></i> חימום הקראות לנושא (אדמין)';
        w.onclick = function () {
            w.disabled = true;
            var lists = sections.filter(function (s) { return s.items && s.items.length && !s.noVideo; }).map(sectionItems);
            WBVideo.warm(lists, function (d, t) { w.innerHTML = 'מחממים… ' + d + ' / ' + t; }).then(function (r) { w.innerHTML = '<i class="fa-solid fa-check"></i> הושלם: ' + (r.total - r.failed) + ' / ' + r.total + (r.failed ? ' (נכשלו ' + r.failed + ')' : ''); });
        };
        $('hero-actions').appendChild(w);
    }
    function note(html) { $('status-box').innerHTML = '<div class="empty-note">' + html + '</div>'; }

    (function init() {
        if (!topic) { $('hero-sub').textContent = ''; note('לא נבחר נושא. חזרו לרשימת הנושאים ובחרו נושא ללימוד.'); return; }
        loadData().then(function (raw) {
            Q = normalize(raw); MANAGED = managedLesson();
            if (!Q.length && !MANAGED) { $('hero-sub').textContent = ''; note('נמצא קובץ נתונים לנושא, אבל לא נמצאו בו שאלות מתאימות לתת-הנושא שנבחר.'); return; }
            pickPools(); buildSections(); render(); heroInfo(); restoreLive(); warmUI();
            if (!Q.some(function (q) { return q.steps.length; }) && !MANAGED) note('לתרגילים בנושא הזה עדיין אין שלבי פתרון מפורטים (solution_steps), ולכן אין דוגמאות וסרטונים. אפשר להוסיף אותם בקובץ הנתונים.');
        }).catch(function (paths) {
            $('hero-sub').textContent = '';
            note('לא נמצא קובץ נתונים לנושא הזה. חיפשנו:<br><span dir="ltr" style="display:block;margin-top:6px">' + (paths || []).map(escapeHtml).join('<br>') + '</span>');
        });
    })();
})();
</script>
